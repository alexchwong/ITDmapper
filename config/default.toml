# ITDmapper packaged defaults.
# Custom settings files may contain only the keys they need to override.

[reads]
# 0 disables MAPQ filtering (BAM only).
min_mapq = 0
# 0 disables mean base-quality filtering. FASTQ filtering is per raw read before collapsing.
min_mean_base_quality = 0.0
# BAM-only flags; preserve historical behaviour unless explicitly enabled.
exclude_duplicates = false
exclude_qcfail = false
# Unique sequence must be observed at least this many times before analysis.
# In FASTQ mode this is applied before amplicon discovery and assignment.
min_read_copies = 2

[amplicon]
# Cluster near-identical alignment start/end pairs within this many bases.
endpoint_tolerance = 5
# Retain clusters with at least this fraction of the dominant cluster support.
min_cluster_fraction = 0.10
# Absolute floor for endpoint-cluster support, weighted by read count.
min_cluster_support = 2
# BAM: fetch this many bases beyond the exon 14-15 target.
# FASTQ: search this broad FLT3 window around the target for amplicon discovery.
target_fetch_flank = 1000
# BAM assignment: one read end may anchor within this distance of an inferred amplicon end.
end_anchor_tolerance = 10
# BAM assignment fallback: minimum genomic overlap with the inferred amplicon.
min_overlap_fraction = 0.50

[fastq]
# Amplicon discovery uses the most abundant unique sequences after quality/copy filtering.
discovery_top_unique = 10

[alignment]
# Legacy mergeITD PairwiseAligner scoring/acceptance parameters.
match = 5
mismatch = -15
gap_open = -36
gap_extend = -0.5
min_aligned_block = 6
# Minimum fraction of an inferred amplicon spanned by an accepted FASTQ sequence.
min_reference_fraction = 0.4
# Minimum fraction of a FASTQ sequence represented by aligned blocks.
min_query_fraction = 0.3
max_indel_fraction = 0.7

[calling]
min_insert_length = 6
min_supporting_reads = 1
# Percent, matching mergeITD semantics (0.006 means 0.006%).
min_vaf_percent = 0.006
